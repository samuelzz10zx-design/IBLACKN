<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos Cinema VIP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: #666;
      font-size: 0.95em;
    }

    .section {
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 1.3em;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #667eea;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .button-group.single {
      grid-template-columns: 1fr;
    }

    .item-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95em;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .item-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .item-btn:active {
      transform: translateY(0);
    }

    .item-price {
      font-size: 0.75em;
      opacity: 0.9;
    }

    .cart-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 2px solid #e9ecef;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .cart-header h2 {
      font-size: 1.2em;
      color: #333;
    }

    .cart-count {
      background: #667eea;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      font-weight: 600;
    }

    #carrinho {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .cart-item-price {
      font-size: 0.9em;
      color: #666;
    }

    .cart-item-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f0f0f0;
      border-radius: 6px;
      padding: 4px 8px;
    }

    .quantity-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
      color: #667eea;
      font-weight: bold;
      padding: 2px 6px;
      transition: color 0.2s;
    }

    .quantity-btn:hover {
      color: #764ba2;
    }

    .quantity-display {
      min-width: 20px;
      text-align: center;
      font-weight: 600;
      color: #333;
    }

    .remove-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85em;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #ff5252;
    }

    .empty-cart {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 0.95em;
    }

    .totals {
      background: white;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      border: 2px solid #e9ecef;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 0.95em;
    }

    .total-row:last-child {
      margin-bottom: 0;
      border-top: 2px solid #e9ecef;
      padding-top: 10px;
      font-size: 1.1em;
      font-weight: 700;
      color: #667eea;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .action-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .clear-btn {
      background: #f0f0f0;
      color: #333;
    }

    .clear-btn:hover {
      background: #e0e0e0;
    }

    .send-btn {
      background: linear-gradient(135deg, #25d366 0%, #20ba5a 100%);
      color: white;
      flex: 2;
    }

    .send-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .timestamp {
      font-size: 0.8em;
      color: #999;
      text-align: center;
      margin-top: 15px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-content h2 {
      margin-bottom: 15px;
      color: #333;
    }

    .modal-content p {
      color: #666;
      margin-bottom: 20px;
      font-size: 0.95em;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .modal-cancel {
      background: #f0f0f0;
      color: #333;
    }

    .modal-cancel:hover {
      background: #e0e0e0;
    }

    .modal-confirm {
      background: linear-gradient(135deg, #25d366 0%, #20ba5a 100%);
      color: white;
    }

    .modal-confirm:hover {
      background: linear-gradient(135deg, #20ba5a 0%, #1a9b4b 100%);
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      .header h1 {
        font-size: 2em;
      }

      .button-group {
        grid-template-columns: 1fr;
      }

      .action-buttons {
        flex-direction: column;
      }

      .action-buttons button {
        flex: 1;
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #764ba2;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🍿 Cinema VIP</h1>
    <p>Faça seu pedido agora!</p>
  </div>

  <!-- PIPOCA -->
  <div class="section">
    <div class="section-title">🍿 Pipoca</div>
    <div class="button-group">
      <button class="item-btn" onclick="addItem('Pipoca Pequena', 15.00)">
        Pipoca Pequena
        <span class="item-price">R$ 15,00</span>
      </button>
      <button class="item-btn" onclick="addItem('Pipoca Média', 22.00)">
        Pipoca Média
        <span class="item-price">R$ 22,00</span>
      </button>
      <button class="item-btn" onclick="addItem('Pipoca Grande', 30.00)">
        Pipoca Grande
        <span class="item-price">R$ 30,00</span>
      </button>
    </div>
  </div>

  <!-- REFRIGERANTE -->
  <div class="section">
    <div class="section-title">🥤 Refrigerante</div>
    <div class="button-group">
      <button class="item-btn" onclick="addItem('Refri Médio', 8.00)">
        Refri Médio
        <span class="item-price">R$ 8,00</span>
      </button>
      <button class="item-btn" onclick="addItem('Refri Grande', 12.00)">
        Refri Grande
        <span class="item-price">R$ 12,00</span>
      </button>
    </div>
  </div>

  <!-- DOCES E OUTROS -->
  <div class="section">
    <div class="section-title">🍬 Doces & Combos</div>
    <div class="button-group">
      <button class="item-btn" onclick="addItem('Combo Pequeno', 35.00)">
        Combo Pequeno
        <span class="item-price">R$ 35,00</span>
      </button>
      <button class="item-btn" onclick="addItem('Combo Médio', 55.00)">
        Combo Médio
        <span class="item-price">R$ 55,00</span>
      </button>
      <button class="item-btn" onclick="addItem('Chocolate Quente', 10.00)">
        Chocolate Quente
        <span class="item-price">R$ 10,00</span>
      </button>
      <button class="item-btn" onclick="addItem('Pipoca Doce', 18.00)">
        Pipoca Doce
        <span class="item-price">R$ 18,00</span>
      </button>
    </div>
  </div>

  <!-- CARRINHO -->
  <div class="cart-section">
    <div class="cart-header">
      <h2>🛒 Carrinho</h2>
      <span class="cart-count"><span id="total-items">0</span> item(ns)</span>
    </div>
    <ul id="carrinho" class="empty-cart">
      Nenhum item adicionado
    </ul>
  </div>

  <!-- TOTAIS -->
  <div class="totals">
    <div class="total-row">
      <span>Subtotal:</span>
      <span id="subtotal">R$ 0,00</span>
    </div>
    <div class="total-row">
      <span>Total:</span>
      <span id="total-price">R$ 0,00</span>
    </div>
  </div>

  <!-- AÇÕES -->
  <div class="action-buttons">
    <button class="clear-btn" onclick="limparCarrinho()">🗑️ Limpar</button>
    <button class="send-btn" id="send-btn" onclick="abrirConfirmacao()" disabled>
      📲 Enviar Pedido
    </button>
  </div>

  <div class="timestamp" id="timestamp"></div>
</div>

<!-- MODAL DE CONFIRMAÇÃO -->
<div class="modal" id="confirmModal">
  <div class="modal-content">
    <h2>✅ Confirmar Pedido</h2>
    <p>Tem certeza que deseja enviar este pedido via WhatsApp?</p>
    <div class="modal-buttons">
      <button class="modal-cancel" onclick="fecharConfirmacao()">Cancelar</button>
      <button class="modal-confirm" onclick="enviarPedido()">Enviar</button>
    </div>
  </div>
</div>

<script>
  let carrinho = [];
  const numero = "5583981735110";

  const items = {
    'Pipoca Pequena': 15.00,
    'Pipoca Média': 22.00,
    'Pipoca Grande': 30.00,
    'Refri Médio': 8.00,
    'Refri Grande': 12.00,
    'Combo Pequeno': 35.00,
    'Combo Médio': 55.00,
    'Chocolate Quente': 10.00,
    'Pipoca Doce': 18.00,
  };

  function addItem(itemName, preco) {
    const existente = carrinho.find(item => item.name === itemName);
    
    if (existente) {
      existente.quantity++;
    } else {
      carrinho.push({
        name: itemName,
        price: preco,
        quantity: 1
      });
    }
    
    atualizarCarrinho();
  }

  function removerItem(index) {
    carrinho.splice(index, 1);
    atualizarCarrinho();
  }

  function alterarQuantidade(index, delta) {
    carrinho[index].quantity += delta;
    
    if (carrinho[index].quantity <= 0) {
      carrinho.splice(index, 1);
    }
    
    atualizarCarrinho();
  }

  function atualizarCarrinho() {
    const lista = document.getElementById("carrinho");
    const totalItems = document.getElementById("total-items");
    const subtotalEl = document.getElementById("subtotal");
    const totalEl = document.getElementById("total-price");
    const sendBtn = document.getElementById("send-btn");

    lista.innerHTML = "";

    if (carrinho.length === 0) {
      lista.innerHTML = '<li class="empty-cart">Nenhum item adicionado</li>';
      totalItems.textContent = "0";
      subtotalEl.textContent = "R$ 0,00";
      totalEl.textContent = "R$ 0,00";
      sendBtn.disabled = true;
      return;
    }

    let total = 0;

    carrinho.forEach((item, index) => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;

      const li = document.createElement("li");
      li.className = "cart-item";
      li.innerHTML = `
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">R$ ${item.price.toFixed(2)}</div>
        </div>
        <div class="cart-item-actions">
          <div class="quantity-control">
            <button class="quantity-btn" onclick="alterarQuantidade(${index}, -1)">−</button>
            <span class="quantity-display">${item.quantity}</span>
            <button class="quantity-btn" onclick="alterarQuantidade(${index}, 1)">+</button>
          </div>
          <button class="remove-btn" onclick="removerItem(${index})">❌</button>
        </div>
      `;
      lista.appendChild(li);
    });

    totalItems.textContent = carrinho.length;
    subtotalEl.textContent = `R$ ${total.toFixed(2)}`;
    totalEl.textContent = `R$ ${total.toFixed(2)}`;
    sendBtn.disabled = false;
  }

  function limparCarrinho() {
    if (carrinho.length === 0) {
      alert("Carrinho já está vazio!");
      return;
    }

    if (confirm("Tem certeza que deseja limpar o carrinho?")) {
      carrinho = [];
      atualizarCarrinho();
    }
  }

  function abrirConfirmacao() {
    document.getElementById("confirmModal").classList.add("active");
  }

  function fecharConfirmacao() {
    document.getElementById("confirmModal").classList.remove("active");
  }

  function enviarPedido() {
    if (carrinho.length === 0) {
      alert("Carrinho vazio!");
      return;
    }

    fecharConfirmacao();

    let mensagem = "*🍿 PEDIDO CINEMA VIP 🍿*%0A";
    mensagem += "==============================%0A%0A";

    let total = 0;

    carrinho.forEach(item => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      mensagem += `• ${item.name}%0A`;
      mensagem += `   Qtd: ${item.quantity} x R$ ${item.price.toFixed(2)}%0A`;
      mensagem += `   Subtotal: R$ ${itemTotal.toFixed(2)}%0A%0A`;
    });

    mensagem += "==============================%0A";
    mensagem += `*TOTAL: R$ ${total.toFixed(2)}*%0A`;
    mensagem += `*Data/Hora: ${obterDataHora()}*%0A`;
    mensagem += "%0A📍 Obrigado por escolher o Cinema VIP!";

    const url = `https://wa.me/${numero}?text=${mensagem}`;
    window.open(url, "_blank");

    // Limpar carrinho após enviar
    setTimeout(() => {
      carrinho = [];
      atualizarCarrinho();
    }, 1000);
  }

  function obterDataHora() {
    const agora = new Date();
    const dia = String(agora.getDate()).padStart(2, '0');
    const mes = String(agora.getMonth() + 1).padStart(2, '0');
    const ano = agora.getFullYear();
    const horas = String(agora.getHours()).padStart(2, '0');
    const minutos = String(agora.getMinutes()).padStart(2, '0');
    
    return `${dia}/${mes}/${ano} às ${horas}:${minutos}`;
  }

  function atualizarTimestamp() {
    const timestamp = document.getElementById("timestamp");
    timestamp.textContent = `Última atualização: ${obterDataHora()}`;
  }

  // Inicializar
  atualizarCarrinho();
  atualizarTimestamp();

  // Fechar modal ao clicar fora
  document.getElementById("confirmModal").addEventListener("click", function(event) {
    if (event.target === this) {
      fecharConfirmacao();
    }
  });
</script>

</body>
</html>
